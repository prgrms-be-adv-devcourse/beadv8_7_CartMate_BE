spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

logging:
  level:
    com.cartmate: INFO
  structured:
    format:
      console: logstash   # 운영 로그는 JSON 한 줄 (traceId · event 등이 필드로 → Alloy가 Loki로)

sentry:
  environment: ${SENTRY_ENVIRONMENT:prod}

custom:
  jwt:
    secret: ${JWT_SECRET}
  member:
    mfa:
      otp-encryption-key: ${MFA_OTP_ENCRYPTION_KEY} # 관리자 OTP 비밀키 암호화 (Base64 32바이트). 기본값 없음: 빠뜨리면 앱이 시작되지 않는다

product:
  global:
    internalUrl: ${PRODUCT_URL}

storage:
  s3:
    bucket: team07-cartmate-s3-storage
    region: ap-northeast-2
    public-url: https://team07-cartmate-s3-storage.s3.ap-northeast-2.amazonaws.com

cartmate:
  mail:
    enabled: true
    from: ${MAIL_FROM}
  mfa:
    code-secret: ${MFA_CODE_SECRET} # 기본값 없음: 빠뜨리면 앱이 시작되지 않는다
  internal:
    api-key: ${INTERNAL_API_KEY}   # 기본값 없음 → 빠뜨리면 앱이 뜨지 않음