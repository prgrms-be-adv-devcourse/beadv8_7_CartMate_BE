// 회원 서버(회원 · 판매자 · 인증). 루트 모놀리스에서 옮겨 온 모듈이다(위치 이동 + 기초 세팅만).
// 공통 설정(java 25 · 저장소 · Spring Boot BOM · lombok)은 루트 build.gradle의 subprojects가 넣는다.
plugins {
    id 'org.springframework.boot'
}

dependencies {
    // global(예외 · RsData · 보안 · outbox · 내부 API 클라이언트 · Redis · S3) + shared(서비스 간 이벤트 · DTO 계약)
    implementation project(':common')
    // Kafka: 다른 서비스와 주고받는 이벤트. cartmate.kafka.enabled=true일 때만 쓴다
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    // 인증 메일 (가입 이메일 확인, 로그인 2차 인증)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 관리자 OTP: TOTP 코드 계산은 표준 구현 라이브러리에 맡기고(RFC 6238), 등록·검증 흐름은 직접 만든다
    implementation 'com.eatthepath:java-otp:0.4.0'
    implementation 'commons-codec:commons-codec' // OTP 비밀키 Base32 (앱 입력용)

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // QueryDSL Q클래스는 이 모듈의 엔티티로 여기서 만든다
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
