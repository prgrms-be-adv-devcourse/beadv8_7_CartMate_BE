server:
  port: 7777
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    com.cartmate: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE

product:
  global:
    internalUrl: http://product-service:${server.port:9999}

storage:
  s3:
    bucket: cartmate-bucket
    region: ap-northeast-2
    public-url: https://cartmate-bucket.s3.ap-northeast-2.amazonaws.com