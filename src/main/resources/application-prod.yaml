spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}

logging:
  level:
    com.cartmate: INFO

custom:
  jwt:
    secret: ${JWT_SECRET}

product:
  global:
    internalUrl: ${PRODUCT_URL}

storage:
  s3:
    bucket: team07-cartmate-s3-storage
    region: ap-northeast-2
    public-url: https://team07-cartmate-s3-storage.s3.ap-northeast-2.amazonaws.com