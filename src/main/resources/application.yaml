server:
  port: 8985
spring:
  application:
    name: cartmate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  batch:
    job:
      enabled: false # Job은 스케줄러가 실행하므로 애플리케이션 시작 시 자동 실행하지 않는다
    jdbc:
      initialize-schema: always # MySQL에도 배치 메타데이터 테이블을 만든다
custom:
  member:
    seller:
      minAge: 19
    phone:
      codeTtlSeconds: 180
      verifiedTtlSeconds: 600
      maxAttempts: 5
  jwt:
    secret: ${JWT_SECRET:cartmate-local-dev-secret-key-must-be-at-least-32-bytes}
    accessTokenExpireSeconds: 1800
    cookie:
      secure: false