server:
  port: 8985
spring:
  application:
    name: cartmate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
custom:
  member:
    seller:
      minAge: 19
    phone:
      codeTtlSeconds: 180
      verifiedTtlSeconds: 600
      maxAttempts: 5
  jwt:
    secret: ${JWT_SECRET:cartmate-local-dev-secret-key-must-be-at-least-32-bytes}
    accessTokenExpireSeconds: 1800
    cookie:
      secure: false