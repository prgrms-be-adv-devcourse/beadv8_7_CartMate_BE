name: Gemini AI Code Review

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.scala'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📂 Get changed Java files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.java
            **/*.kt
            **/*.scala
          separator: ","

      - name: 🐍 Setup Python (without cache)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 --version
          pip3 --version

      - name: 📦 Install Python dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          pip3 install --user --upgrade pip
          pip3 install --user google-generativeai==0.3.2
          pip3 install --user PyGithub==1.59.1
          echo "설치 완료!"
          pip3 list --user

      - name: 🤖 Gemini AI Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          cat << 'PYTHON_SCRIPT_EOF' > gemini_review.py
          import os
          import sys
          import time
          import subprocess

          try:
              import google.generativeai as genai
              from github import Github
              print("✅ 모든 라이브러리 import 성공")
          except ImportError as e:
              print(f"❌ 라이브러리 import 실패: {e}")
              sys.exit(1)

          def get_git_diff(file_path):
              try:
                  result = subprocess.run(
                      ['git', 'diff', 'HEAD~1..HEAD', '--', file_path],
                      capture_output=True,
                      text=True,
                      timeout=10
                  )
                  return result.stdout if result.returncode == 0 else "diff를 가져올 수 없습니다."
              except Exception as e:
                  return f"diff 오류: {str(e)}"

          def analyze_file_with_gemini(model, file_path, file_content, git_diff):
              if len(file_content) > 6000:
                  lines = file_content.split('\n')
                  if len(lines) > 150:
                      file_content = '\n'.join(lines[:150]) + '\n\n... (파일이 길어서 일부만 표시됩니다)'

              if len(git_diff) > 1500:
                  git_diff = git_diff[:1500] + '\n... (diff가 길어서 일부만 표시됩니다)'

              prompt = f"""
                다음 Java 코드를 리뷰해주세요 (한국어로):
          
                파일: { file_path }
          
                변경사항:
                  { git_diff }
          
                파일 내용:
                  { file_content }
          
                먼저 이번 PR의 주요 변경점을 불릿 형태로 정리해서 보여주세요. 
                그리고 나서 다음 관점에서 코드를 간단히 검토해주세요:
                  1. 🐛 버그 위험성 (논리 오류)
                  2. ⚡ 성능 이슈 (비효율적 코드)
                  3. 🔒 보안 문제 (입력 검증 등)
                  4. 📏 코딩 컨벤션 (네이밍, 포맷팅)
          
                  중요한 이슈만 2-3개 간략하게 정리해주세요.
                  그리고 기존코드의 작업을 어느정도 감안해주세요.
                  그리고 최대한 변경내용에 대한 부분만 확인해주세요. 기존코드를 모두 확인하면 리팩토링의 범위가 너무 커질것 같아요. 
                  문제없으면 "✅ 특별한 이슈 없음"이라고 해주세요.
                  """

              try:
                  response = model.generate_content(prompt)
                  return response.text
              except Exception as e:
                  return f"❌ Gemini 분석 오류: {str(e)}"

          def main():
              print("🚀 Gemini AI 코드 리뷰 시작...")
          
              api_key = os.environ.get('GEMINI_API_KEY')
              github_token = os.environ.get('GITHUB_TOKEN')
              github_repo = os.environ.get('GITHUB_REPOSITORY')
              pr_number = os.environ.get('PR_NUMBER')
          
              if not all([api_key, github_token, github_repo, pr_number]):
                  print("❌ 필수 환경변수 누락")
                  return

              try:
                  genai.configure(api_key=api_key)
                  model = genai.GenerativeModel('gemini-1.5-flash')
                  print("✅ Gemini API 연결 성공")
          
                  g = Github(github_token)
                  repo = g.get_repo(github_repo)
                  pr = repo.get_pull(int(pr_number))
                  print(f"✅ GitHub API 연결 성공 - PR #{pr_number}")
          
                  changed_files_str = "${{ steps.changed-files.outputs.all_changed_files }}"
                  if not changed_files_str or changed_files_str.strip() == "":
                      print("ℹ️ 변경된 Java 파일이 없습니다.")
                      return
          
                  changed_files = [f.strip() for f in changed_files_str.split(',') if f.strip()]
                  print(f"📁 변경된 파일: {len(changed_files)}개")
          
                  MAX_FILES = 6
                  if len(changed_files) > MAX_FILES:
                      changed_files = changed_files[:MAX_FILES] 
                      print(f"⚠️ 무료 티어 한도로 {MAX_FILES}개 파일만 리뷰")
          
                  review_parts = []
                  review_parts.append("# 🤖 Gemini AI 코드 리뷰")
                  review_parts.append(f"📊 분석 파일: {len(changed_files)}개")
                  review_parts.append("")
          
                  success_count = 0
          
                  for i, file_path in enumerate(changed_files):
                      if not file_path.endswith(('.java', '.kt', '.scala')):
                          continue

                      print(f"🔍 분석: {file_path}")
          
                      try:
                          if not os.path.exists(file_path):
                              review_parts.append(f"## 📁 {file_path}")
                              review_parts.append("⚠️ 파일이 존재하지 않습니다.")
                              continue

                          with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
          
                          diff = get_git_diff(file_path)
          
                          if i > 0:
                              time.sleep(3)
          
                          result = analyze_file_with_gemini(model, file_path, content, diff)
          
                          review_parts.append(f"## 📁 `{file_path}`")
                          review_parts.append("")
                          review_parts.append(result)
                          review_parts.append("")
                          review_parts.append("---")
          
                          success_count += 1
                          print(f"✅ {file_path} 완료")
          
                      except Exception as e:
                          print(f"❌ {file_path} 실패: {e}")
                          review_parts.append(f"## 📁 `{file_path}`")
                          review_parts.append(f"❌ 분석 실패: {str(e)}")
                          review_parts.append("---")
          
                  review_parts.append("")
                  review_parts.append("🤖 *Google Gemini AI로 생성됨*")
                  review_parts.append(f"📈 성공: {success_count}/{len(changed_files)}개")
          
                  comment = "\n".join(review_parts)
          
                  existing = None
                  for c in pr.get_issue_comments():
                      if "🤖 Gemini AI 코드 리뷰" in c.body:
                          existing = c
                          break
          
                  if existing:
                      existing.edit(comment)
                      print("✅ 기존 코멘트 업데이트")
                  else:
                      pr.create_issue_comment(comment)
                      print("✅ 새 코멘트 생성")
          
                  print(f"🎉 리뷰 완료! {success_count}개 파일 분석됨")
          
              except Exception as e:
                  print(f"💥 오류 발생: {e}")
          
                  try:
                      error_msg = f"""
                      # ❌ Gemini AI 리뷰 오류
          
                      오류가 발생했습니다: {str(e)}
          
                      해결 방법:
                        1. GEMINI_API_KEY 확인
                        2. API 한도 확인
                        3. Actions 재실행
                      """
          
                      g = Github(github_token)
                      repo = g.get_repo(github_repo)
                      pr = repo.get_pull(int(pr_number))
                      pr.create_issue_comment(error_msg)
                  except:
                      pass
          
          if __name__ == "__main__":
              main()
          PYTHON_SCRIPT_EOF
          
          python3 gemini_review.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: 📊 Review Complete
        if: always()
        run: |
          echo "🎯 Gemini AI 코드 리뷰 완료!"
          echo "📝 PR에서 결과를 확인하세요."