name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]
  # 자동 빌드가 실패해서 반영되지 않은 서비스를 다시 빌드할 때 쓴다. main에서만 이미지를 올린다
  workflow_dispatch:
    inputs:
      service:
        description: '빌드할 서비스 (all = 5개 전부)'
        required: true
        type: choice
        options: [ all, member-service, product-service, order-service, payment-service, etc-service ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 액션은 태그가 아니라 커밋 해시로 고정한다(태그는 액션 저장소 쪽에서 다른 커밋으로 옮길 수 있다). 주석은 해시의 버전
jobs:
  # 바뀐 파일로 테스트할 모듈과 이미지를 만들 서비스를 고른다
  #   서비스 폴더가 바뀜 → 그 서비스만
  #   공통(common · 루트 gradle · Dockerfile · 이 파일)이 바뀜 → 전부
  #   그 외(k8s · docs · observability 등)만 바뀜 → 없음
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # PR에서 바뀐 파일 목록을 GitHub API로 읽는다
    outputs:
      test-modules: ${{ steps.pick.outputs.test-modules }}
      image-services: ${{ steps.pick.outputs.image-services }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # push 직전 커밋과 비교하려면 이전 커밋이 있어야 한다

      - name: Find changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 비교 기준을 push한 브랜치 자신으로 둔다 → push는 항상 push 직전 커밋과 비교한다
          #   지정하지 않으면 기본 브랜치(dev)가 아닌 브랜치(main)에 push할 때 dev와 비교한다.
          #   dev를 그대로 머지한 main은 dev와 내용이 같아 "바뀐 파일 없음"이 되고 이미지를 하나도 만들지 않는다
          # PR 이벤트에서는 이 값을 쓰지 않고 PR 대상 브랜치와 비교한다
          base: ${{ github.ref_name }}
          filters: |
            shared:
              - 'common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yaml'
            member-service: 'member-service/**'
            product-service: 'product-service/**'
            order-service: 'order-service/**'
            payment-service: 'payment-service/**'
            etc-service: 'etc-service/**'
            ai-service: 'ai-service/**'

      # test-modules: 테스트할 모듈(공백 구분, all = 전체). image-services: 이미지를 만들 서비스(JSON 배열)
      - name: Pick modules
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          DEPLOYABLE="member-service product-service order-service payment-service etc-service"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SERVICE" = "all" ]; then
              tests="all"; images="$DEPLOYABLE"
            else
              tests="$INPUT_SERVICE"; images="$INPUT_SERVICE"
            fi
          elif echo "$CHANGES" | jq -e 'index("shared")' > /dev/null; then
            tests="all"; images="$DEPLOYABLE"
          else
            tests=$(echo "$CHANGES" | jq -r 'join(" ")')
            images=""
            for service in $DEPLOYABLE; do
              if echo "$CHANGES" | jq -e --arg s "$service" 'index($s)' > /dev/null; then
                images="$images $service"
              fi
            done
          fi

          images_json=$(jq -R -c 'split(" ") | map(select(length > 0))' <<< "$images")
          echo "테스트할 모듈: ${tests:-(없음)}"
          echo "이미지를 만들 서비스: $images_json"
          echo "test-modules=$tests" >> "$GITHUB_OUTPUT"
          echo "image-services=$images_json" >> "$GITHUB_OUTPUT"

  # job 이름(ci-pipeline)은 브랜치 보호 규칙의 필수 검사 이름과 맞추려고 그대로 둔다
  ci-pipeline:
    needs: changes
    if: needs.changes.outputs.test-modules != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        env:
          TEST_MODULES: ${{ needs.changes.outputs.test-modules }}
        run: |
          chmod +x gradlew
          if [ "$TEST_MODULES" = "all" ]; then
            ./gradlew test --continue
          else
            tasks=()
            for module in $TEST_MODULES; do tasks+=(":$module:test"); done
            echo "실행할 테스트: ${tasks[*]}"
            ./gradlew "${tasks[@]}" --continue
          fi

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            */build/reports/tests/test
            */build/test-results/test
          retention-days: 7

  # main에 push(병합)됐거나 main에서 수동 실행했을 때만, 바뀐 서비스의 이미지를 만들어 올린다
  # 이미지 이름: <Docker Hub 계정>/cartmate-<서비스>, 태그: sha-<커밋 앞 7자리> (latest는 쓰지 않는다)
  build-images:
    needs: [ changes, ci-pipeline ]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.image-services != '[]' &&
      needs.ci-pipeline.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.image-services) }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cartmate-${{ matrix.service }}
          flavor: |
            latest=false
          tags: |
            type=sha

      - name: Build and Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 서비스마다 캐시를 따로 둔다. 같은 scope를 쓰면 서로 캐시를 덮어쓴다
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # CD가 이번에 새 이미지로 바꿀 서비스 목록을 파일로 남긴다(CD는 CI가 성공했을 때만 실행되므로 목록의 이미지는 모두 올라가 있다)
  deploy-targets:
    needs: [ changes, build-images ]
    if: needs.build-images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write deploy targets
        env:
          IMAGE_SERVICES: ${{ needs.changes.outputs.image-services }}
        run: echo "$IMAGE_SERVICES" | jq -r '.[]' > deploy-targets.txt && cat deploy-targets.txt

      - name: Upload deploy targets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-targets
          path: deploy-targets.txt
          retention-days: 7
