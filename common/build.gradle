// 모든 서비스가 함께 쓰는 공통 코드(global). 실행 jar가 아닌 라이브러리로 빌드한다
plugins {
    id 'java-library'
}

dependencies {
    // api: 이 모듈을 쓰는 서비스에도 그대로 전달된다 (global 클래스의 public 시그니처에 나오는 라이브러리)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    api 'org.redisson:redisson:4.8.0'

    // QueryDSL: BaseEntity 같은 공통 엔티티의 Q클래스도 여기서 만든다
    api 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // JWT
    api 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

    // S3
    api platform('software.amazon.awssdk:bom:2.25.0')
    api 'software.amazon.awssdk:s3'

    // Outbox · ShedLock
    api 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    api 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Kafka: 공용 전송 싱크 · 수신 다리(global/kafka). 쓰는 서비스만 spring-boot-starter-kafka를 직접 넣는다.
    // 여기서는 컴파일만 하고 넘기지 않아 Kafka를 안 쓰는 서비스에는 들어가지 않는다
    compileOnly 'org.springframework.kafka:spring-kafka'

    // 관측 가능성: 분산 추적(traceId) · health · 예외 수집. traceparent 도우미(global/observability)가 Tracer를 쓰므로 api
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-opentelemetry'   // Micrometer Tracing + OTel 브리지 + OTLP 내보내기
    api 'org.springframework.boot:spring-boot-starter-restclient'       // RestClient.Builder 빈 (관찰 붙음 → 내부 API 호출에 traceparent 헤더)
    api 'io.sentry:sentry-spring-boot-4-starter:8.62.0'                  // 2026-10-27 배포. SENTRY_DSN이 없으면 꺼짐
    api 'io.sentry:sentry-logback:8.62.0'                                // ERROR 로그 → Sentry

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'   // traceparent 왕복 테스트용 실제 추적기 (버전은 BOM)
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
