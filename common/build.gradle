// 모든 서비스가 함께 쓰는 공통 코드(global). 실행 jar가 아닌 라이브러리로 빌드한다
plugins {
    id 'java-library'
}

dependencies {
    // api: 이 모듈을 쓰는 서비스에도 그대로 전달된다 (global 클래스의 public 시그니처에 나오는 라이브러리)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    api 'org.redisson:redisson:4.8.0'

    // QueryDSL: BaseEntity 같은 공통 엔티티의 Q클래스도 여기서 만든다
    api 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // JWT
    api 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

    // S3
    api platform('software.amazon.awssdk:bom:2.25.0')
    api 'software.amazon.awssdk:s3'

    // Outbox · ShedLock
    api 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    api 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'
}
