name: cartmate-backend

services:
  app:
    image: "${APP_IMAGE:?APP_IMAGE is not set}:${APP_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "8985:8985"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is not set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is not set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-} # key 설정 후 변경 필요
      PLATFORM_MEMBER_ID: ${PLATFORM_MEMBER_ID:-1}
      PRODUCT_URL: ${PRODUCT_URL:-http://localhost:8985}
      REDIS_CACHE_HOST: ${REDIS_HOST:?REDIS_HOST is not set}
      REDIS_CORE_HOST: ${REDIS_HOST:?REDIS_HOST is not set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
      REDIS_DATABASE: ${REDIS_DATABASE:?REDIS_DATABASE is not set}