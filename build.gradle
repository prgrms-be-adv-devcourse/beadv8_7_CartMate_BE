// 루트는 실행 앱이 아니라 멀티모듈 공통 빌드 설정만 둔다(2026-11-06 루트 모놀리스 제거).
// 실행 앱: member-service · product-service · order-service · payment-service · ai-service · etc-service
// 공통 코드: common (global · shared)
plugins {
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.cartmate'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		// 소스 파일은 UTF-8. Windows 기본 인코딩(MS949)으로 읽으면 한글 문자열·로그가 깨진다
		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
		}
		tasks.withType(Javadoc).configureEach {
			options.encoding = 'UTF-8'
		}
		tasks.withType(Test).configureEach {
			systemProperty 'file.encoding', 'UTF-8'
		}
	}
}