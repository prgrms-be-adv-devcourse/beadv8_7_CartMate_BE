# Loki 로그 기반 알림 3개 (업무 이벤트 2개 + 서비스 ERROR 급증). Prometheus 없이 Loki 쿼리로 건다.
#  알림 받는 곳: 로컬은 Grafana 화면(경보 목록)만. 운영(Grafana Cloud)은 Discord 연락처 + CartMate 폴더 알림 정책 (README)
apiVersion: 1

groups:
  - orgId: 1
    name: cartmate-business
    folder: CartMate
    interval: 1m
    rules:
      - uid: cartmate-payment-compensate-failed
        title: 결제 보상(되돌리기) 실패
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({service=~".+", env!="loadtest"} | json | event=~"payment.compensate|payment.compensate.request" | result="FAILED" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK          # 실패 로그가 없으면 정상
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: 결제 되돌리기가 실패했습니다. 돈이 어긋났을 수 있어 수동 확인이 필요합니다.
          description: 'Loki: {service=~".+", env!="loadtest"} | json | event=~"payment.compensate.*" | result="FAILED" → traceId로 Tempo 확인'

      - uid: cartmate-event-delivery-given-up
        title: 이벤트 전달 포기 (Outbox · Inbox · DLT)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({service=~".+", env!="loadtest"} | json | event=~"outbox.failed|inbox.failed|kafka.dlt" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: 서비스 간 이벤트 전달을 포기했습니다 (재시도 끝). 받는 쪽 처리가 빠졌을 수 있습니다.
          description: 'Loki: {service=~".+", env!="loadtest"} | json | event=~"outbox.failed|inbox.failed|kafka.dlt" → eventId · topic 확인'

      # 서비스별로 따로 울린다 (service 라벨마다 알림 1개). 5분에 ERROR 10건 이상
      - uid: cartmate-service-error-spike
        title: 서비스 ERROR 급증
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum by (service) (count_over_time({service=~".+", env!="loadtest", level="ERROR"} [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [10]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          # provisioning 파일은 $를 환경 변수로 바꾸므로 템플릿 변수는 $$로 쓴다
          summary: '{{ $$labels.service }}에서 5분 동안 ERROR 로그가 {{ $$values.B }}건 났습니다. 장애이거나 의존 서비스(DB · Redis · Kafka · 외부 API)가 끊겼을 수 있습니다.'
          description: 'Loki: {service="{{ $$labels.service }}", level="ERROR"} → 로그의 traceId로 Tempo 확인, Sentry 이슈도 확인'
