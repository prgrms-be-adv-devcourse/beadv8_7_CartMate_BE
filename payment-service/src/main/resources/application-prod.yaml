spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

logging:
  level:
    com.cartmate: INFO
  structured:
    format:
      console: logstash   # 운영 로그는 JSON 한 줄 (traceId · event 등이 필드로 → Alloy가 Loki로)

sentry:
  environment: ${SENTRY_ENVIRONMENT:prod}

custom:
  jwt:
    secret: ${JWT_SECRET}

product:
  global:
    internalUrl: ${PRODUCT_URL}

storage:
  s3:
    bucket: team07-cartmate-s3-storage
    region: ap-northeast-2
    public-url: https://team07-cartmate-s3-storage.s3.ap-northeast-2.amazonaws.com

cartmate:
  internal:
    api-key: ${INTERNAL_API_KEY}   # 기본값 없음 → 빠뜨리면 앱이 뜨지 않음