# Spring TestContext가 읽는 설정(SpringProperties: 클래스패스 루트의 spring.properties).
# 캐시된 테스트 컨텍스트 상한. 넘으면 가장 오래 안 쓴 컨텍스트를 닫고 새로 띄운다(Spring 7은 새 컨텍스트를 띄우기 전에 닫는다).
# 상한 8 × Hikari 풀 10 = 80 ≤ MySQL max_connections 100 - 여유 10 (application-test.yaml · CartMateTestContainers).
# 공용 컨텍스트는 3개(통합 · JPA · Kafka)라 여유가 있다. 컨텍스트 목록은 build/reports/test-contexts.md에 남는다.
spring.test.context.cache.maxSize=8
