spring:
  # DB 주소 · 계정은 support/CartMateTestContainers의 @ServiceConnection이 넣는다(싱글턴 MySQL 컨테이너)
  datasource:
    hikari:
      minimum-idle: 1
      idle-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

logging:
  level:
    com.cartmate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.testcontainers: INFO
