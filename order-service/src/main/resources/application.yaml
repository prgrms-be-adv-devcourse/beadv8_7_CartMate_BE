# 주문 서버(장바구니 · 공동구매 · 주문 · 어뷰징 · 수요 매칭) 설정. 모놀리스(루트)와 따로 뜬다.
server:
  port: ${ORDER_SERVICE_PORT:8986}
spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 주문 전용 MySQL. 로컬은 같은 MySQL에 스키마만 따로 둔다 (createDatabaseIfNotExist)
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3306/cartmate_order?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ORDER_DB_POOL_SIZE:10}   # MySQL-주문 max_connections 40 — 재배포 중 두 벌이 겹쳐도 넘지 않게
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  kafka:
    # cartmate.kafka.enabled=true일 때만 실제로 연결한다(기본 꺼짐 → 브로커 없이도 지금처럼 동작)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all   # 복제본까지 받아야 성공(outbox 행을 PUBLISHED로 바꾸는 근거)
    consumer:
      group-id: order-service
      auto-offset-reset: earliest   # 처음 붙을 때 쌓인 메시지부터 받는다(중복은 processed_event가 거름)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # 관측: 보낼 때 traceparent 헤더를 싣고, 받을 때 이어 붙인다 (기본 꺼짐)
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

custom:
  jwt:
    # 회원 서버가 발급한 토큰을 검증만 한다. 회원 서버와 같은 키여야 한다
    secret: ${JWT_SECRET:cartmate-local-dev-secret-key-must-be-at-least-32-bytes}
    accessTokenExpireSeconds: 1800
  cookie:
    secure: false

cartmate:
  kafka:
    enabled: ${KAFKA_ENABLED:false}   # 켜면 outbox 이벤트를 Kafka로도 내보내고, 상품 · 배송 이벤트를 Kafka로 받는다(MSA-5)
  payment:
    client: http   # 주문 서버에는 결제 Facade가 없다. 결제 서버 내부 API만 쓴다
    base-url: ${PAYMENT_BASE_URL:http://localhost:8983}   # payment-service
  product-service:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8982}   # product-service
  member-service:
    base-url: ${MEMBER_SERVICE_BASE_URL:http://localhost:8981}   # member-service
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-key}   # /internal/** 서버 간 호출 키. 운영은 반드시 환경 변수로

# 관측 가능성 (서비스 공통 — 바꾸면 다른 서비스 application.yaml도 같이)
management:
  endpoints:
    web:
      exposure:
        include: health   # actuator는 health만. SecurityConfig가 permitAll이라 노출 범위를 좁게 고정
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # 트래픽이 적어 100%
  # OTLP 트레이스 주소는 환경 변수 OTEL_EXPORTER_OTLP_TRACES_ENDPOINT. 없으면 내보내지 않음 (traceId는 로그에만)
  # 빈 값으로 적으면 앱이 안 뜨므로 여기 적지 않는다 → common OtlpEndpointEnvironmentPostProcessor가 값이 있을 때만 넘김
  otlp:
    metrics:
      export:
        enabled: false   # 메트릭은 이번 범위 밖 (기본 켜짐이라 localhost:4318로 계속 보내려 함)
  observations:
    annotations:
      enabled: true   # cron 배치의 @Observed (실행 1회 = span 하나)

sentry:
  dsn: ${SENTRY_DSN:}   # 비어 있으면 꺼짐
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  exception-resolver-order: -2147483647   # @RestControllerAdvice가 처리한 예외도 보게 (4xx는 SentryEventFilter가 거름)
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
