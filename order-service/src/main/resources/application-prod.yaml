spring:
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    hibernate:
      # 운영은 스키마를 자동으로 바꾸지 않고 엔티티와 맞는지만 확인한다.
      # 첫 배포(빈 DB)나 엔티티 변경 배포 때만 JPA_DDL_AUTO=update를 명시해서 넘긴다(Flyway 도입 전 임시 정책, ARCH-14)
      ddl-auto: ${JPA_DDL_AUTO:validate}

logging:
  level:
    com.cartmate: INFO

custom:
  jwt:
    secret: ${JWT_SECRET}

cartmate:
  payment:
    base-url: ${PAYMENT_BASE_URL}
  product-service:
    base-url: ${PRODUCT_SERVICE_BASE_URL}
  member-service:
    base-url: ${MEMBER_SERVICE_BASE_URL}
  internal:
    api-key: ${INTERNAL_API_KEY}   # 기본값 없음 → 빠뜨리면 앱이 뜨지 않음
